<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>럽리브 페이스 분석결과지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5.3.0/700.css">
<link rel="stylesheet" href="js/style.css">
<style>
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#f6f3ef;z-index:100}
#login .lbox{background:#fff;border:1px solid #e3dcd4;border-radius:16px;padding:34px 38px;text-align:center;width:min(420px,92vw)}
#login h1{font-size:20px;margin:10px 0 6px}#login p{font-size:13px;color:#7d7168;line-height:1.6}#gbtn{display:flex;justify-content:center;margin:14px 0}
.busy{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:98;color:#fff;font-size:16px;font-weight:700}
.hgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;max-height:300px;overflow:auto;padding:4px;margin:6px 0}
.hgal div{border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;position:relative}.hgal div.on{border-color:#7a5c44}
.hgal img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.hgal span{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:9px;padding:2px 3px;line-height:1.2}
</style></head><body>
<script src="js/logo.js"></script><script src="js/lib.js"></script><script src="js/engine.js"></script><script src="js/render.js"></script>
<script src="js/mkguide.js"></script>
<script src="js/makeup.js"></script><script src="js/shell.js"></script><script src="js/ai_image.js"></script><script src="js/ui.js"></script>
</body></html>
